[package]
name = "bareeye"
version = "0.1.0"
edition = "2024"

[dependencies]
cameras = { version = "0.3.2", features = ["controls"] }
eframe = "=0.34.3"
egui-cameras = "0.3.2"
ort = { version = "=2.0.0-rc.13", features = ["cuda"] }
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_DirectShow",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[build-dependencies]
embed-manifest = "1.5.0"

[profile.dev.package."*"]
opt-level = 3
